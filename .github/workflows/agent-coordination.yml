name: Agent coordination

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - coordination/tasks.json
      - scripts/coordination/**
      - .github/workflows/agent-coordination.yml

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: >-
      github.repository == 'erythrofr/ClothCraft' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
        startsWith(github.event.comment.body, '/coord ')))
    # Apply admission before concurrency: unrelated discussion and bot replies
    # must not replace a pending writer with a skipped job.
    # Pending admitted jobs can still be replaced; each scans all pending commands.
    concurrency:
      group: clothcraft-agent-coordination-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fetch only trusted default-branch code, never an issue author's branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check coordination reducer
        run: node --test scripts/coordination/engine.test.mjs
      - name: Reconcile task reservations
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const moduleUrl = pathToFileURL(`${process.cwd()}/scripts/coordination/reconcile.mjs`);
            const { reconcile } = await import(moduleUrl.href);
            await reconcile({ github, context, core });
