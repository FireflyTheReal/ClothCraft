name: CPU reference
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features -j 2 -- --test-threads=2
      - run: cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/two-panel.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/local-ease.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/tshirt.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/dress.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/curved-panels.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- simulate examples/templates/two-panel.json --steps 30 --threads 2 --output output/ci-template
  # Gating, not advisory. The `cpu` job above builds only
  # --no-default-features, so render.rs, atelier.rs and editor.rs were
  # otherwise never compiled on a push: 42.9% of src/ ran under no executed
  # test, and commits adding thousands of desktop-only lines went unchecked.
  #
  # Made gating after verifying locally on macOS arm64: `cargo check` for both
  # desktop binaries reported 0 errors and 0 warnings, `clippy --all-targets
  # -- -D warnings` exited 0, and the desktop test target passed with 23 suites
  # / 165 tests / 0 failures. Exit codes and pass/fail counts do not depend on
  # machine load, unlike timings -- which is why this bar is stated in those
  # terms. The three GPU tests stay `#[ignore]`d, keeping the job GPU-free.
  desktop:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The desktop test target LINKS, so it needs X11/Wayland and an OpenGL
      # loader; `check` and `clippy` alone would not require them.
      - name: Install Linux windowing and GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libssl-dev pkg-config
      - run: cargo check --locked --features desktop -j 2 --bin cloth-fit --bin marvelous-cloth
      - run: cargo clippy --locked --features desktop --all-targets -j 2 -- -D warnings
      - run: cargo test --locked --features desktop -j 2 -- --test-threads=2
